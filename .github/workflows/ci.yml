name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Part 1 - classify today's weather
        run: python src/classify_today.py
      - name: Part 2 - forecast tomorrow's rain
        run: python src/forecast_tomorrow.py
      - name: Tests
        run: pytest -q
